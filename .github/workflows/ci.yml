name: CI

# Fails when these vectors no longer match what the reference implementation
# (forgesworn/signet-contacts, main) produces. sync.yml is what fixes that.

on:
  push:
    branches: [main, 'sync/**', 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: forgesworn/signet-contacts
          ref: main
          path: .reference
          persist-credentials: false
      # Pinned: the invite relay cases depend on the runtime's WHATWG URL
      # implementation, and Node 22 and 24 disagree on it.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
      - name: Build the reference
        working-directory: .reference
        run: npm ci && npm run build
      - name: Vectors match the reference
        env:
          SIGNET_CONTACTS_DIR: .reference
        run: node scripts/generate.mjs --check
